<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff Review | CloudCord</title><link rel="icon" href="assets/cloudcord-favicon.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head>
<body class="review-page"><script>const t=localStorage.getItem('theme');if(t==='light'||(!t&&matchMedia('(prefers-color-scheme:light)').matches))document.body.classList.add('light');</script>
<div id="loginView" class="admin-login"><form id="loginForm" class="login-card"><img src="assets/cloudcord-favicon.png" alt="CloudCord"><div class="admin-kicker">Restricted access</div><h1>Staff review</h1><p>Enter the server-side admin password to continue.</p><label><span>Admin password</span><input id="adminPassword" type="password" autocomplete="current-password" required autofocus></label><button type="submit">Sign in <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><div id="loginError" class="login-error"></div></form></div>
<div id="dashboardView" class="admin-dashboard" hidden><header class="admin-topbar"><a href="/" aria-label="CloudCord home"><img src="assets/cloudcord-favicon.png" alt="CloudCord"></a><div><span class="live-dot"></span> Staff applications</div><button id="logoutButton" type="button">Log out</button></header><main class="admin-shell"><section class="admin-heading"><div><div class="admin-kicker">CloudCord operations</div><h1>Application queue</h1><p>Review verified applicants and send decisions through the CloudCord bot.</p></div><button id="refreshButton" type="button" class="icon-button" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 9a7 7 0 0 1 11.7-2L20 9M4 15l2.2 2a7 7 0 0 0 11.7-2"/></svg></button></section><div class="queue-tabs" role="tablist"><button class="active" data-status="pending">Pending <span id="pendingCount">0</span></button><button data-status="accepted">Accepted</button><button data-status="denied">Denied</button></div><div id="queueState" class="queue-state">Loading applications…</div><div id="applicationList" class="application-list"></div></main></div>
<div id="reviewDrawer" class="review-drawer" aria-hidden="true"><div class="drawer-backdrop" data-close></div><aside class="drawer-panel"><button class="drawer-close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div id="drawerContent"></div></aside></div><div id="adminToast" class="admin-toast"></div><script src="admin.js"></script></body></html>
