<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Templates | CloudCord</title>
    <meta name="description" content="Browse CloudCord profile templates made by the community and apply one in a click.">
    <meta property="og:title" content="CloudCord Profile Templates">
    <meta property="og:description" content="Browse community profile templates and apply one in CloudCord.">
    <link rel="icon" href="/assets/cloudcord-favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/staff-application.css?v=2">
    <link rel="stylesheet" href="/templates.css">
</head>
<body class="staff-page">
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) document.body.classList.add('light');
    </script>

    <nav class="navbar staff-nav">
        <div class="nav-content">
            <a href="/" class="logo-link" aria-label="CloudCord home"><img src="/assets/cloudcord-favicon.png" alt="CloudCord" class="nav-logo"></a>
            <a href="/" class="staff-home-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Return home</a>
        </div>
    </nav>

    <main class="tpl-shell">
        <header class="application-hero">
            <div class="eyebrow"><span></span> Made by the community</div>
            <h1>Profile<br><em>templates.</em></h1>
            <p>Find a look you love and apply it in CloudCord. Open <strong>Custom Profile → Templates</strong> in the app, or copy a code from here.</p>
        </header>

        <div class="tpl-toolbar">
            <input id="tplSearch" type="search" placeholder="Search templates" maxlength="60" aria-label="Search templates">
            <div class="tpl-sort" role="group" aria-label="Sort">
                <button type="button" data-sort="popular" class="active">Popular</button>
                <button type="button" data-sort="new">New</button>
            </div>
        </div>
        <div class="tpl-chips" id="tplCategories"></div>

        <div class="tpl-grid" id="tplGrid" aria-live="polite"></div>
        <p class="tpl-empty" id="tplEmpty" hidden>No templates yet. Publish yours from <strong>Custom Profile → Templates → Publish</strong>.</p>
        <div class="tpl-more"><button type="button" class="secondary-button" id="tplMore" hidden>Load more</button></div>
    </main>

    <div id="toast" class="application-toast" role="status"></div>
    <script src="/templates.js"></script>
</body>
</html>
